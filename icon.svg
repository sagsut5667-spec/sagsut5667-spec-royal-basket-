<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1a1a2e" />
  
  <!-- Outer Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f39c12" stroke-width="14" />

  <!-- Shopping Cart Icon -->
  <g transform="translate(130, 130) scale(0.65)">
    <!-- Cart Body -->
    <path d="M40 60 h50 l50 160 h180 l50 -120 h-230" fill="none" stroke="#f1c40f" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Wheels -->
    <circle cx="160" cy="270" r="20" fill="#f39c12" />
    <circle cx="320" cy="270" r="20" fill="#f39c12" />
    <!-- Box inside cart -->
    <rect x="160" y="100" width="100" height="80" rx="8" fill="#e67e22" />
  </g>

  <!-- Text: रॉयल बास्केट -->
  <text x="256" y="420" font-family="Segoe UI, sans-serif" font-size="42" font-weight="bold" fill="#f1c40f" text-anchor="middle">रॉयल बास्केट</text>
</svg>
