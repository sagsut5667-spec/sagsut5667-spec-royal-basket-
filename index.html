<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBasket - ग्रोसरी डिलिव्हरी</title>

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'%3E%3Ccircle cx='256' cy='256' r='240' fill='%2328a745'/%3E%3Cpath d='M130 200 H382 L350 380 H162 Z' fill='%23ffffff' opacity='0.9'/%3E%3Cpath d='M110 160 H402 V190 H110 Z' fill='%23ffffff' rx='10'/%3E%3Cpath d='M190 160 V110 C190 85 322 85 322 110 V160' fill='none' stroke='%23ffffff' stroke-width='24' stroke-linecap='round'/%3E%3Ccircle cx='210' cy='260' r='28' fill='%23ffc107'/%3E%3Ccircle cx='270' cy='250' r='32' fill='%23dc3545'/%3E%3Ccircle cx='320' cy='275' r='24' fill='%2317a2b8'/%3E%3C/svg%3E">
    
    <!-- Firebase SDK Scripts (Compat Versions for Phone Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>RBasket लॉगिन</h2>
        
        <!-- मोबाईल नंबर इनपुट फॉर्म -->
        <div id="phone-login-section">
            <p>मोबाईल नंबर टाका</p>
            <input type="text" id="phone-number" placeholder="+91 मोबाईल नंबर (उदा. +919876543210)">
            <button id="sign-in-button" onclick="sendOTP()">OTP पाठवा</button>
        </div>

        <!-- कॅप्चा व्हेरिफेकेशनसाठी जागा -->
        <div id="recaptcha-container"></div>

        <!-- OTP टाकण्याचा फॉर्म (सुरुवातीला लपलेला) -->
        <div id="otp-section" style="display: none;">
            <p>तुमच्या मोबाईलवर आलेला OTP टाका</p>
            <input type="text" id="otp-code" placeholder="6 अंकी OTP टाका">
            <button onclick="verifyOTP()">OTP तपासा</button>
        </div>
    </div>

    <script>
        // तुमच्या Firebase ची खरी माहिती
        const firebaseConfig = {
          apiKey: "AIzaSyAGIGDVZ2aYmgVywJvoWloa9WFyecjTQe0",
          authDomain: "royal-basket-30948.firebaseapp.com",
          projectId: "royal-basket-30948",
          storageBucket: "royal-basket-30948.firebasestorage.app",
          messagingSenderId: "416510046272",
          appId: "1:416510046272:web:a996b3f1de1bea89106fa5",
          measurementId: "G-PPRMS4GV6E"
        };

        // Firebase इनिशियलाइज करणे
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // रीकॅप्चा सेट करणे
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible',
                'callback': (response) => {
                    sendOTP();
                }
            });
        };

        // OTP पाठवण्याचे फंक्शन
        function sendOTP() {
            const phoneNumber = document.getElementById('phone-number').value;
            const appVerifier = window.recaptchaVerifier;

            auth.signInWithPhoneNumber(phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    alert('OTP यशस्वीरित्या पाठवला आहे!');
                    document.getElementById('phone-login-section').style.display = 'none';
                    document.getElementById('otp-section').style.display = 'block';
                }).catch((error) => {
                    console.error("OTP पाठवताना एरर आला: ", error);
                    alert('OTP पाठवला गेला नाही. कृपया नंबर तपासा.');
                });
        }

        // OTP व्हेरिफाय करण्याचे फंक्शन
        function verifyOTP() {
            const code = document.getElementById('otp-code').value;
            window.confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                alert('लॉगिन यशस्वी झाले! स्वागत आहे.');
            }).catch((error) => {
                alert('चुकीचा OTP! कृपया पुन्हा प्रयत्न करा.');
            });
        }
    </script>
</body>
</html>
