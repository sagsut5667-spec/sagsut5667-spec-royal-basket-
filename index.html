<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रॉयल मॉल बास्केट</title>
    <link rel="icon" href="https://img.icons8.com/color/96/shopping-cart.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f7;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 40px;
        }
        .header-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        h1 {
            color: #27ae60;
            font-size: 24px;
            margin: 5px 0;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .shop-btn {
            background: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .shop-btn:hover {
            background: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://img.icons8.com/color/96/shopping-cart.png" class="header-icon" alt="Cart Logo">
        <h1>रॉयल मॉल बास्केट</h1>
        <div class="subtitle">आपली घरपोच भाजी व किराणा सेवा</div>

        <p style="font-size: 14px; color: #555;">आमच्या मोबाईल ॲपमध्ये आपले स्वागत आहे! ताजे भाजीपाला आणि किराणा सामान घरपोच मागवा.</p>

        <button class="shop-btn" onclick="alert('खरेदी पेज लवकरच सुरू होईल!')">खरेदी सुरू करा</button>
    </div>

</body>
</html>
