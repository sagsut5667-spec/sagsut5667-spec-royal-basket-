<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रॉयल मॉल बास्केट</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .product-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card h3 { font-size: 18px; margin: 10px 0; color: #27ae60; }
        .product-card p { font-size: 16px; font-weight: bold; color: #e74c3c; }
        .product-card button { background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .product-card button:hover { background-color: #219653; }
    </style>
</head>
<body>

    <h1>रॉयल मॉल बास्केट - प्रॉडक्ट सूची</h1>
    <div class="product-container" id="product-grid"></div>

    <script>
        // सर्व प्रॉडक्ट्स आणि किमतींची एकत्रित यादी
        const allStoreProducts = [
            { id: 1, name: "मूग (प्रति किलो)", price: 110 },
            { id: 2, name: "आख्खा मसर (प्रति किलो)", price: 90 },
            { id: 3, name: "पिवळी हरभरा डाळ (प्रति किलो)", price: 94 },
            { id: 4, name: "उडीद डाळ (प्रति किलो)", price: 138 },
            { id: 5, name: "छोले (प्रति किलो)", price: 120 },
            { id: 6, name: "वरी (प्रति किलो)", price: 200 },
            { id: 7, name: "तुकडा इंद्राणी तांदूळ (प्रति किलो)", price: 72 },
            { id: 8, name: "अखंड इंद्राणी तांदूळ (प्रति किलो)", price: 86 },
            { id: 9, name: "महालक्ष्मी शाळू (प्रति किलो)", price: 72 },
            { id: 10, name: "मोती गोल्ड शाळू (प्रति किलो)", price: 70 },
            { id: 11, name: "तुलसी शाळू (प्रति किलो)", price: 57 },
            { id: 12, name: "५ स्टार शाळू (प्रति किलो)", price: 64 },
            { id: 13, name: "अमोल गहू (प्रति किलो)", price: 46 },
            { id: 14, name: "ऑलपिक गहू (प्रति किलो)", price: 48 },
            { id: 15, name: "किंग गहू (प्रति किलो)", price: 42 },
            { id: 16, name: "बाजरी (प्रति किलो)", price: 42 },
            { id: 17, name: "नाचना / नाचणी (प्रति किलो)", price: 55 },
            { id: 18, name: "JSR कोलम राईस (प्रति किलो)", price: 70 },
            { id: 19, name: "HMT बिर्ला जीरा तांदूळ (प्रति किलो)", price: 76 },
            { id: 20, name: "वाडा कोलम तांदूळ (प्रति किलो)", price: 88 },
            { id: 21, name: "इंडिया गेट (प्रति किलो)", price: 150 },
            { id: 22, name: "जाडा तांदूळ (प्रति किलो)", price: 45 },
            { id: 23, name: "रुची भोग ६ नंबर (प्रति किलो)", price: 104 },
            { id: 24, name: "केशव ९० (प्रति किलो)", price: 120 },
            { id: 25, name: "साहेब राईस (प्रति किलो)", price: 120 },
            { id: 26, name: "तारिफ राईस (प्रति किलो)", price: 110 },
            { id: 27, name: "दावत ७० (प्रति किलो)", price: 69 },
            { id: 28, name: "RB कंडा (प्रति किलो)", price: 44 },
            { id: 29, name: "सेवन स्टार (प्रति किलो)", price: 65 }
        ];

        // वेबसाईटवर प्रॉडक्ट्स कार्ड स्वरूपात दाखवणारे फंक्शन
        function displayProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = "";
            
            allStoreProducts.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>किंमत: रु. ${item.price}</p>
                    <button onclick="addToCart('${item.name}', ${item.price})">बास्केटमध्ये टाका</button>
                `;
                grid.appendChild(card);
            });
        }

        // प्रॉडक्ट बास्केटमध्ये ॲड झाल्यावर मेसेज दाखवणारे फंक्शन
        function addToCart(name, price) {
            alert(name + ' (रु. ' + price + ') बास्केटमध्ये यशस्वीरित्या जोडले!');
        }

        // पेज लोड झाल्यावर सर्व प्रॉडक्ट्स स्क्रीनवर दिसतील
        window.onload = displayProducts;
    </script>

</body>
</html>
