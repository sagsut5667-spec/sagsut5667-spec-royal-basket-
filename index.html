<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रॉयल मॉल बास्केट</title>
    <link rel="icon" href="https://img.icons8.com/color/96/shopping-cart.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            color: #333333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            margin-top: 40px;
        }
        .header-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin: 5px 0;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
            background: #f9f9f9;
        }
        .login-btn {
            background: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://img.icons8.com/color/96/shopping-cart.png" class="header-icon" alt="Cart Logo">
        <h1>रॉयल मॉल बास्केट</h1>
        <div class="subtitle">मोबाईल नंबर आणि पासवर्ड टाка</div>

        <div class="form-group">
            <select id="langSelect">
                <option value="mr">मराठी (Marathi)</option>
                <option value="en">English</option>
                <option value="hi">हिंदी</option>
            </select>
        </div>

        <div class="form-group">
            <input type="text" placeholder="१० अंकी मोबाईल नंबर" maxlength="10">
        </div>

        <div class="form-group">
            <input type="password" placeholder="पासवर्ड / OTP">
        </div>

        <button class="login-btn" onclick="alert('लॉगिन यशस्वी झाले!')">लॉगिन करा</button>
    </div>

</body>
</html>
