<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रॉयल मॉल बास्केट | Royal Mall Basket</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .festival-banner {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        .search-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .product-price {
            color: #e67e22;
            font-weight: bold;
        }
        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .weight-select, .qty-input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
        }
        .add-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 9px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <header>
        रॉयल मॉल बास्केट 🛒
    </header>

    <!-- दसरा व दिवाळी सण शुभेच्छा बॅनर्स -->
    <div class="festival-banner">
        <h2 style="margin: 0 0 5px 0; font-size: 18px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">✨ दसरा व दिवाळीच्या हार्दिक शुभेच्छा! 🪔</h2>
        <p style="margin: 0; font-size: 12px; font-weight: bold; line-height: 1.4;">
            रॉयल मॉल बास्केट परिवाराकडून आपणास व आपल्या कुटुंबास सुख-समृद्धी लाभो!
        </p>
    </div>

    <div class="container">
        <!-- सर्च बार -->
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 धान्य, तांदूळ किंवा किराणा शोधा..." onkeyup="filterProducts()">

        <!-- उत्पादनांची यादी (वजन आणि प्रमाण निवडण्याच्या पर्यायासह) -->
        <div id="productList">
            <div class="product-card" data-name="पिसाळी हमरा डահळ तांदूळ">
                <div class="product-info">
                    <span class="product-name">पिसाळी हमरा डहाळ तांदूळ</span>
                    <span class="product-price">₹94 / किलो</span>
                </div>
                <div class="controls-row">
                    <select class="weight-select">
                        <२०० ग्रॅम> २५० ग्रॅम</option>
                        <option value="500">५०० ग्रॅम</option>
                        <option value="1000" selected>१ किलो</option>
                        <option value="2000">२ किलो</option>
                        <option value="5000">५ किलो</option>
                        <option value="10000">१० किलो</option>
                        <option value="25000">२५ किलो</option>
                    </select>
                    <input type="number" class="qty-input" min="1" value="1" placeholder="नग">
                    <button class="add-btn" onclick="addToCart(this)">बास्केटमध्ये टाका</button>
                </div>
            </div>

            <div class="product-card" data-name="उडीद डाळ">
                <div class="product-info">
                    <span class="product-name">उडीद डाळ</span>
                    <span class="product-price">₹138 / किलो</span>
                </div>
                <div class="controls-row">
                    <select class="weight-select">
                        <option value="250">२५० ग्रॅम</option>
                        <option value="500">५०० ग्रॅम</option>
                        <option value="1000" selected>१ किलो</option>
                        <option value="2000">२ किलो</option>
                        <option value="5000">५ किलो</option>
                        <option value="10000">१० किलो</option>
                        <option value="25000">२५ किलो</option>
                    </select>
                    <input type="number" class="qty-input" min="1" value="1" placeholder="नग">
                    <button class="add-btn" onclick="addToCart(this)">बास्केटमध्ये टाका</button>
                </div>
            </div>

            <div class="product-card" data-name="मुग डाळ">
                <div class="product-info">
                    <span class="product-name">मुग डाळ</span>
                    <span class="product-price">₹110 / किलो</span>
                </div>
                <div class="controls-row">
                    <select class="weight-select">
                        <option value="250">२५० ग्रॅम</option>
                        <option value="500">५०० ग्रॅम</option>
                        <option value="1000" selected>१ किलो</option>
                        <option value="2000">२ किलो</option>
                        <option value="5000">५ किलो</option>
                        <option value="10000">१० किलो</option>
                        <option value="25000">२५ किलो</option>
                    </select>
                    <input type="number" class="qty-input" min="1" value="1" placeholder="नग">
                    <button class="add-btn" onclick="addToCart(this)">बास्केटमध्ये टाका</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // सर्च फिल्टर फंक्शन
        function filterProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                if (name.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function addToCart(button) {
            let card = button.closest('.product-card');
            let name = card.querySelector('.product-name').innerText;
            let weight = card.querySelector('.weight-select').selectedOptions[0].text;
            let qty = card.querySelector('.qty-input').value;
            alert(name + ' (' + weight + ') - ' + qty + ' नग बास्केटमध्ये समाविष्ट केले!');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
