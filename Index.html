<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBasket - ग्रोसरी डिलिव्हरी</title>
    <!-- ॲप आयकॉन -->
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>RBasket लॉगिन</h2>
        
        <!-- मोबाईल नंबर इनपुट फॉर्म -->
        <div id="phone-login-section">
            <p>मोबाईल नंबर टाका</p>
            <input type="text" id="phone-number" placeholder="+91 मोबाईल नंबर (उदा. +919876543210)">
            <button id="sign-in-button" onclick="sendOTP()">OTP पाठवा</button>
        </div>

        <!-- कॅप्चा व्हेरिफेकेशनसाठी जागा -->
        <div id="recaptcha-container"></div>

        <!-- OTP टाकण्याचा फॉर्म (सुरुवातीला लपलेला) -->
        <div id="otp-section" style="display: none;">
            <p>तुमच्या मोबाईलवर आलेला OTP टाка</p>
            <input type="text" id="otp-code" placeholder="6 अंकी OTP टाका">
            <button onclick="verifyOTP()">OTP तपासा</button>
        </div>
    </div>

    <script>
        // तुमच्या Firebase ची माहिती येथे जोडली जाईल
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase इनिशियलाइज करणे
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // रीकॅप्चा सेट करणे
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible',
                'callback': (response) => {
                    sendOTP();
                }
            });
        };

        // OTP पाठवण्याचे फंक्शन
        function sendOTP() {
            const phoneNumber = document.getElementById('phone-number').value;
            const appVerifier = window.recaptchaVerifier;

            auth.signInWithPhoneNumber(phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    alert('OTP यशस्वीरित्या पाठवला आहे!');
                    document.getElementById('phone-login-section').style.display = 'none';
                    document.getElementById('otp-section').style.display = 'block';
                }).catch((error) => {
                    console.error("OTP पाठवताना एरर आला: ", error);
                    alert('OTP पाठवला गेला नाही. पुन्हा प्रयत्न करा.');
                });
        }

        // OTP व्हेरिफाय करण्याचे फंक्शन
        function verifyOTP() {
            const code = document.getElementById('otp-code').value;
            window.confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                alert('लॉगिन यशस्वी झाले! स्वागत आहे.');
                // इथे लॉगिननंतर मुख्य पेजवर रीडायरेक्ट करू शकता
            }).catch((error) => {
                alert('चुकीचा OTP! कृपया पुन्हा प्रयत्न करा.');
            });
        }
    </script>
</body>
</html>
